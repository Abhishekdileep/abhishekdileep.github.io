<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  <header class="site-head">
    <a class="site-name" href="{{ '/' | relative_url }}">{{ site.author }}</a>
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}">about</a>
      <a href="{{ '/research/' | relative_url }}">research</a>
      <a href="{{ '/blog/' | relative_url }}">blog</a>
      <a href="{{ '/talks/' | relative_url }}">talks</a>
      <a href="{{ '/cv/' | relative_url }}">cv</a>
    </nav>
  </header>

  <main class="content">
    {{ content }}
  </main>

  <footer class="site-foot">
    <span>© {{ 'now' | date: "%Y" }} {{ site.author }}</span>
    <span class="foot-links">
      <a href="mailto:{{ site.email }}">email</a>
      <a href="https://github.com/{{ site.github_username }}">github</a>
      {% if site.linkedin_url != "" %}<a href="{{ site.linkedin_url }}">linkedin</a>{% endif %}
      {% if site.scholar_url != "" %}<a href="{{ site.scholar_url }}">scholar</a>{% endif %}
    </span>
  </footer>
</body>
</html>
